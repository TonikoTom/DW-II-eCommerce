<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vitrine da Loja</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light" style="font-family: 'Open Sans', sans-serif;">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>🛍️ Nossos Produtos</h1>
        <a href="carrinho.html" class="btn btn-primary">Ver Carrinho 🛒</a>
    </div>

    <div class="row" id="vitrine-produtos">
        <!-- Os produtos vão aparecer aqui dentro via JavaScript -->
    </div>
</div>

<script>
    // Busca os produtos cadastrados na sua api_estoque.php
    async function carregarVitrine() {
        const resposta = await fetch('api_estoque.php');
        const produtos = await resposta.json();
        const vitrine = document.getElementById('vitrine-produtos');
        
        vitrine.innerHTML = '';

        produtos.forEach(p => {
            const precoFormatado = parseFloat(p.preco).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            
            // Desativa o botão se o estoque estiver zerado
            const esgotado = p.estoque <= 0;
            const textoBotao = esgotado ? 'Esgotado' : 'Adicionar ao Carrinho';
            const classeBotao = esgotado ? 'btn-secondary disabled' : 'btn-success';

            const card = `
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <h5 class="card-title">${p.nome}</h5>
                            <p class="text-muted small">Disponível: ${p.estoque} un</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="fs-5 fw-bold text-dark">${precoFormatado}</span>
                                <button onclick="adicionarAoCarrinho(${p.id})" class="btn ${classeBotao}">
                                    ${textoBotao}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            vitrine.innerHTML += card;
        });
    }

    // Envia o ID do produto para salvar na sessão da api_carrinho.php
    async function adicionarAoCarrinho(idProduto) {
        try {
            const resposta = await fetch('api_carrinho.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ produto_id: idProduto, quantidade: 1 })
            });
            
            const resultado = await resposta.json();
            
            if (resultado.sucesso) {
                alert(resultado.mensagem);
            } else {
                alert(resultado.mensagem);
            }
        } catch (erro) {
            alert('Erro ao adicionar produto.');
        }
    }

    // Executa ao carregar a página
    carregarVitrine();
</script>
</body>
</html>
